<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leo AI">
<title>Leo AI - المساعد الخارق</title>
<style>
  :root { --bg: #0b1120; --card: #1e293b; --primary: #3b82f6; --text: #f8fafc; --muted: #94a3b8; --danger: #ef4444; --success: #10b981; }
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .screen { display: none; flex-direction: column; height: 100%; padding: 16px; overflow-y: auto; }
  .active { display: flex; }
  input, textarea, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 12px; border: 1px solid #334155; background: var(--card); color: var(--text); font-size: 15px; }
  button { background: var(--primary); border: none; font-weight: bold; cursor: pointer; }
  button:active { opacity: 0.8; }
  .btn-danger { background: var(--danger); }
  .btn-success { background: var(--success); }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: var(--card); border-bottom: 1px solid #334155; }
  .chat-selector { display: flex; gap: 6px; padding: 8px 12px; background: #131c31; border-bottom: 1px solid #334155; }
  .chat-selector select { margin: 0; padding: 8px; flex: 1; }
  .chat-selector button { width: auto; margin: 0; padding: 8px 12px; }
  .nav { display: flex; background: var(--card); border-top: 1px solid #334155; padding: 6px 0; }
  .nav button { background: none; margin: 0; font-size: 12px; color: var(--muted); border-radius: 0; padding: 8px 4px; }
  .nav button.active-tab { color: var(--primary); font-weight: bold; }
  .chat-box { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 12px 14px; border-radius: 16px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }
  .user { background: var(--primary); align-self: flex-start; border-bottom-right-radius: 4px; }
  .leo { background: var(--card); align-self: flex-end; border-bottom-left-radius: 4px; border: 1px solid #334155; }
  .input-area { display: flex; gap: 6px; padding: 8px 10px; background: var(--card); }
  .input-area input { margin: 0; flex: 1; }
  .input-area button { width: auto; margin: 0; padding: 0 16px; }
  .card { background: var(--card); padding: 14px; border-radius: 14px; margin-bottom: 12px; border: 1px solid #334155; }
  img.gen-img { width: 100%; border-radius: 12px; margin-top: 10px; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; padding: 20px; z-index: 99; }
</style>
</head>
<body>

<div id="lock-screen" class="screen active" style="justify-content: center; text-align: center;">
  <h2>🔒 برنامج ليو (Leo AI)</h2>
  <p style="color: var(--muted);" id="lock-msg">أدخل كلمة السر الخاصة بك للدخول</p>
  <input type="password" id="pass-input" placeholder="كلمة السر...">
  <button type="button" onclick="handleAuth()">دخول</button>
</div>

<div id="main-app" style="display: none; flex-direction: column; height: 100%;">
  <div class="header">
    <strong>🤖 ليو (Leo) | محدث لحظياً ⚡</strong>
    <button type="button" onclick="lockApp()" style="width:auto; padding:6px 12px; margin:0; font-size:12px;" class="btn-danger">قفل 🔒</button>
  </div>

  <div id="tab-chat" class="screen active" style="padding: 0;">
    <div class="chat-selector">
      <select id="session-select" onchange="switchSession()"></select>
      <button type="button" onclick="newSession()" class="btn-success">+ محادثة</button>
      <button type="button" onclick="deleteSession()" class="btn-danger">حذف</button>
    </div>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
      <input type="text" id="user-msg" placeholder="اسأل ليو عن أي حاجة بتحصل دلوقتي..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button type="button" onclick="sendMsg()">إرسال</button>
    </div>
  </div>

  <div id="tab-media" class="screen">
    <h3>🎨 صانع الصور وفيديوهات التيك توك</h3>
    <div class="card">
      <label>اكتب وصف الصورة أو فكرة فيديو تيك توك (أقل من دقيقة):</label>
      <textarea id="media-prompt" rows="3" placeholder="اكتب فكرتك هنا..."></textarea>
      <button type="button" onclick="generateImage()">توليد صورة مجانية 🖼️</button>
      <button type="button" onclick="generateTikTok()" class="btn-success">عمل سكريبت ومشاهد تيك توك 🎬</button>
    </div>
    <div id="media-result"></div>
  </div>

  <div id="tab-vault" class="screen">
    <h3>🛡️ خزنة أسرارك (على تليفونك فقط)</h3>
    <p style="color: var(--muted); font-size: 12px;">محفوظة في ذاكرة جهازك إنت بس ومحدش في العالم يقدر يوصلها.</p>
    <div class="card">
      <input type="text" id="secret-title" placeholder="العنوان (الرقم القومي، باسورد، إلخ)">
      <textarea id="secret-val" rows="2" placeholder="البيانات السرية..."></textarea>
      <button type="button" onclick="saveSecret()" class="btn-success">حفظ في الخزنة 🔐</button>
    </div>
    <div id="vault-list"></div>
  </div>

  <div id="tab-settings" class="screen">
    <h3>🧠 ذاكرة ليو الموحدة والإعدادات</h3>
    <div class="card">
      <label>معلوماتك الأساسية (ليو هيفضل فاكرها في كل المحادثات):</label>
      <textarea id="global-memory" rows="3" placeholder="مثال: اسمي أحمد، بدرس برمجة وأمن سيبراني، بحب الردود السريعة والمنظمة..."></textarea>
      <button type="button" onclick="saveMemory()" class="btn-success">حفظ في ذاكرة ليو 🧠</button>
    </div>
    <div class="card">
      <label>مفتاح Google Gemini API المجاني:</label>
      <input type="password" id="api-key-input" placeholder="AIzaSy...">
      <button type="button" onclick="saveApiKey()">حفظ المفتاح</button>
    </div>
    <div class="card">
      <label>تغيير كلمة سر التطبيق:</label>
      <input type="password" id="new-pass-input" placeholder="كلمة السر الجديدة">
      <button type="button" onclick="changePass()" class="btn-danger">تحديث كلمة السر</button>
    </div>
  </div>

  <div class="nav">
    <button type="button" class="active-tab" onclick="switchTab('chat', this)">💬 المحادثات</button>
    <button type="button" onclick="switchTab('media', this)">🎨 صور وتيك توك</button>
    <button type="button" onclick="switchTab('vault', this)">🛡️ الخزنة</button>
    <button type="button" onclick="switchTab('settings', this)">🧠 الذاكرة والإعدادات</button>
  </div>
</div>

<div id="perm-modal" class="modal">
  <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
    <h3>⚠️ طلب إذن من ليو</h3>
    <p id="perm-text">هل تسمح لـ ليو بفتح هذا الرابط؟</p>
    <button type="button" onclick="confirmOpen(true)" class="btn-success">موافق، افتح ✅</button>
    <button type="button" onclick="confirmOpen(false)" class="btn-danger">رفض ❌</button>
  </div>
</div>

<script>
  let pendingUrl = "";
  let sessions = {};
  let currentSessionId = "";

  window.onload = function() {
    if (!localStorage.getItem("leo_pass")) {
      document.getElementById("lock-msg").innerText = "أهلاً يا مخترعي! اعمل كلمة سر جديدة عشان محدش يفتح ليو غيرك:";
    }
    document.getElementById("api-key-input").value = localStorage.getItem("leo_api") || "";
    document.getElementById("global-memory").value = localStorage.getItem("leo_memory") || "";
    initSessions();
    renderVault();
  };

  function handleAuth() {
    const input = document.getElementById("pass-input").value;
    const saved = localStorage.getItem("leo_pass");
    if (!input) {
      alert("اكتب كلمة السر الأول!");
      return;
    }
    if (!saved) {
      localStorage.setItem("leo_pass", input);
      alert("تم حفظ كلمة السر بنجاح!");
      unlockApp();
    } else if (input === saved) {
      unlockApp();
    } else {
      alert("كلمة السر غلط! غير مصرح بالدخول.");
    }
  }

  function unlockApp() {
    document.getElementById("lock-screen").classList.remove("active");
    document.getElementById("main-app").style.display = "flex";
    document.getElementById("pass-input").value = "";
  }

  function lockApp() {
    document.getElementById("main-app").style.display = "none";
    document.getElementById("lock-screen").classList.add("active");
  }

  function switchTab(tab, btn) {
    document.querySelectorAll("#main-app .screen").forEach(function(s) { s.classList.remove("active"); });
    document.querySelectorAll(".nav button").forEach(function(b) { b.classList.remove("active-tab"); });
    document.getElementById("tab-" + tab).classList.add("active");
    btn.classList.add("active-tab");
  }

  function initSessions() {
    sessions = JSON.parse(localStorage.getItem("leo_sessions") || "{}");
    if (Object.keys(sessions).length === 0) {
      const id1 = "chat_" + Date.now();
      sessions[id1] = { name: "💻 برمجة وأمن سيبراني", messages: [{ sender: "leo", text: "أهلاً بيك في قسم البرمجة والأمن السيبراني! جاهز لأي كود أو شرح بالتفصيل." }] };
      const id2 = "chat_" + (Date.now() + 1);
      sessions[id2] = { name: "💼 شغل ووظائف ومهام", messages: [{ sender: "leo", text: "أهلاً بيك في قسم الشغل! قولي ندور على إيه النهاردة." }] };
      const id3 = "chat_" + (Date.now() + 2);
      sessions[id3] = { name: "💬 دردشة عامة وأخبار اليوم", messages: [{ sender: "leo", text: "أهلاً يا صاحبي! أنا متوصل بالإنترنت لحظة بلحظة، اسألني عن أي حاجة بتحصل دلوقتي." }] };
      saveSessions();
    }
    currentSessionId = Object.keys(sessions)[0];
    updateSessionDropdown();
    renderChat();
  }

  function updateSessionDropdown() {
    const sel = document.getElementById("session-select");
sel.innerHTML = Object.keys(sessions).map(function(id) {
return <option value="${id}" ${id === currentSessionId ? 'selected' : ''}>${sessions[id].name}</option>;
}).join("");
}
function switchSession() {
currentSessionId = document.getElementById("session-select").value;
renderChat();
}
function newSession() {
const name = prompt("اكتب اسم المحادثة الجديدة (مثلاً: مذاكرة، تخطيط فرح، إلخ):");
if (!name) return;
const id = "chat_" + Date.now();
sessions[id] = { name: name, messages: [{ sender: "leo", text: أهلاً بيك في محادثة "${name}"! أنا فاكر كل بياناتك وجاهز أساعدك. }] };
currentSessionId = id;
saveSessions();
updateSessionDropdown();
renderChat();
}
function deleteSession() {
if (Object.keys(sessions).length <= 1) {
alert("لازم يكون فيه محادثة واحدة على الأقل!");
return;
}
if (confirm("متأكد إنك عايز تمسح المحادثة دي؟")) {
delete sessions[currentSessionId];
currentSessionId = Object.keys(sessions)[0];
saveSessions();
updateSessionDropdown();
renderChat();
}
}
function saveSessions() {
localStorage.setItem("leo_sessions", JSON.stringify(sessions));
}
function renderChat() {
const box = document.getElementById("chat-box");
const msgs = (sessions[currentSessionId] && sessions[currentSessionId].messages) || [];
box.innerHTML = msgs.map(function(m) {
return <div class="msg ${m.sender}">${m.text}</div>;
}).join("");
box.scrollTop = box.scrollHeight;
}
function saveMemory() {
localStorage.setItem("leo_memory", document.getElementById("global-memory").value);
alert("تم تحديث ذاكرة ليو الموحدة بنجاح!");
}
function saveApiKey() {
localStorage.setItem("leo_api", document.getElementById("api-key-input").value.trim());
alert("تم حفظ المفتاح!");
}
function changePass() {
const p = document.getElementById("new-pass-input").value;
if (p) {
localStorage.setItem("leo_pass", p);
alert("تم تحديث كلمة السر!");
}
}
function saveSecret() {
const title = document.getElementById("secret-title").value;
const val = document.getElementById("secret-val").value;
if (!title || !val) return;
const list = JSON.parse(localStorage.getItem("leo_vault") || "[]");
list.push({ title: title, val: val });
localStorage.setItem("leo_vault", JSON.stringify(list));
document.getElementById("secret-title").value = "";
document.getElementById("secret-val").value = "";
renderVault();
}
function renderVault() {
const list = JSON.parse(localStorage.getItem("leo_vault") || "[]");
document.getElementById("vault-list").innerHTML = list.map(function(item, i) {
return <div class="card"> <strong>🔑 ${item.title}</strong> <p style="margin:6px 0; color:#cbd5e1;">${item.val}</p> <button type="button" onclick="deleteSecret(${i})" class="btn-danger" style="padding:6px; font-size:12px;">حذف</button> </div>;
}).join("");
}
function deleteSecret(i) {
const list = JSON.parse(localStorage.getItem("leo_vault") || "[]");
list.splice(i, 1);
localStorage.setItem("leo_vault", JSON.stringify(list));
renderVault();
}
async function callLeo(promptText, includeHistory) {
const apiKey = localStorage.getItem("leo_api");
if (!apiKey) {
return "من فضلك افتح (الذاكرة والإعدادات) تحت وحط مفتاح Google Gemini API المجاني الأول!";
}
const now = new Date().toLocaleString('ar-EG', { dateStyle: 'full', timeStyle: 'long' });
const memory = localStorage.getItem("leo_memory") || "لا توجد معلومات إضافية بعد.";
const systemPrompt = `أنت 'ليو' (Leo)، برنامج ذكاء اصطناعي خارق يجمع قدرات ChatGPT و Gemini و Claude. مخترعك ومالكك الوحيد هو المستخدم.
التاريخ والوقت الحالي الآن بالظبط هو: ${now}.
معلومات المستخدم الأساسية (الذاكرة الموحدة): ${memory}.
تعليمات صارمة:
1. اتكلم باللهجة المصرية الذكية والواضحة، واشرح بالتفصيل لما يطلب منك.
2. استخدم بحث Google الحي دائماً عشان تجيب أحدث أخبار ومعلومات اللحظة الحالية (${now}) وماتجيبش أي معلومات قديمة أبداً.
3. ساعده في البرمجة، الأمن السيبراني الدفاعي والحماية، حل الامتحانات، الترجمة لكل اللغات، الوظائف، تنظيم المناسبات، وحل مشاكل التليفون والكمبيوتر.
4. لو طلب فتح موقع أو مكان، اكتب الرابط بصيغة https://... عشان النظام ياخد إذنه قبل الفتح.`;let contextText = systemPrompt + "\n\n";
if (includeHistory && sessions[currentSessionId]) {
const recent = sessions[currentSessionId].messages.slice(-6);
contextText += "سياق المحادثة الحالية:\n" + recent.map(function(m) {
return ${m.sender === 'user' ? 'المستخدم' : 'ليو'}: ${m.text};
}).join("\n") + "\n\n";
}
contextText += "طلب المستخدم الآن: " + promptText;try {
const res = await fetch(https://googleapis.com{apiKey}, {
method: "POST",
headers: { "Content-Type": "application/json" },
body: JSON.stringify({
contents: [{ parts: [{ text: contextText }] }],
tools: [{ googleSearch: {} }]
})
});
const data = await res.json();
if (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0]) {
return data.candidates[0].content.parts[0].text;
}
return "حصلت مشكلة في الاتصال، تأكد من المفتاح والإنترنت.";
} catch (e) {
return "تأكد من اتصالك بالإنترنت ومفتاح الـ API.";
}
}
async function sendMsg() {
const input = document.getElementById("user-msg");
const text = input.value.trim();
if (!text) return;
sessions[currentSessionId].messages.push({ sender: "user", text: text });
input.value = "";
renderChat();
sessions[currentSessionId].messages.push({ sender: "leo", text: "ليو بيبحث في الإنترنت الآن..." });
renderChat();
const reply = await callLeo(text, true);
sessions[currentSessionId].messages[sessions[currentSessionId].messages.length - 1].text = reply;
saveSessions();
renderChat();
const urlMatch = reply.match(/https?://[^\s)]+/);
if (urlMatch) {
pendingUrl = urlMatch[0];
document.getElementById("perm-text").innerText = "ليو بيستأذنك يفتح الرابط ده:\n" + pendingUrl;
document.getElementById("perm-modal").style.display = "flex";
}
}
function confirmOpen(allow) {
document.getElementById("perm-modal").style.display = "none";
if (allow && pendingUrl) {
window.open(pendingUrl, "_blank");
}
pendingUrl = "";
}
function generateImage() {
const prompt = document.getElementById("media-prompt").value.trim();
if (!prompt) {
alert("اكتب وصف الصورة الأول!");
return;
}
const url = https://pollinations.ai{encodeURIComponent(prompt)}?width=720&height=1280&nologo=true;
document.getElementById("media-result").innerHTML =  <div class="card"> <p>جاري رسم الصورة بمقاس تيك توك...</p> <img class="gen-img" src="${url}" alt="Leo Image"> </div>;
}
async function generateTikTok() {
const idea = document.getElementById("media-prompt").value.trim();
if (!idea) {
alert("اكتب فكرة الفيديو الأول!");
return;
}
const resDiv = document.getElementById("media-result");
resDiv.innerHTML = "ليو بيكتب السكريبت وبيجهز المشاهد...";
const script = await callLeo(اكتب لي سكريبت فيديو تيك توك قصير (أقل من دقيقة) باللهجة المصرية عن: "${idea}". قسمه إلى 4 مشاهد، واكتب في كل مشهد الكلام اللي هيتقال ووصف الصورة المناسبة ليه., false);
resDiv.innerHTML = <div class="card" style="white-space: pre-wrap;">${script}</div>;
}
